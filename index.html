<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Education Perfect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <div class="site-layout">
            <nav class="site-nav">
                <a href="index.html" class="nav-link active">
                    Chat
                </a>

                <a href="poker.html" class="nav-link">
                    Poker
                </a>

                <a href="recovery.html" class="nav-link">
                    Recovery
                </a>

                <a href="account.html" class="nav-link">
                    Account
                </a>

                <button
                    id="logout-button"
                    class="nav-button"
                    type="button"
                >
                    Log out
                </button>
            </nav>

            <section class="panel chat-panel">
                <header class="chat-header">
                    <div>
                        <p class="eyebrow">PUBLIC ROOM</p>
                        <h1>Quick Chat</h1>
                    </div>

                    <div class="user-controls">
                        <div class="profile-summary">
                            <span id="current-user"></span>

                            <span
                                id="current-user-id"
                                class="user-id"
                            ></span>
                        </div>

                        <span class="balance-badge">
                            <span id="chip-balance">0</span>
                            chips
                        </span>
                    </div>
                </header>

                <div
                    id="connection-status"
                    class="connection-status"
                    aria-live="polite"
                >
                    Connecting...
                </div>

                <ol
                    id="message-list"
                    class="message-list"
                    aria-live="polite"
                ></ol>

                <form
                    id="message-form"
                    class="message-form"
                >
                    <label
                        class="screen-reader-only"
                        for="message-input"
                    >
                        Message
                    </label>

                    <input
                        id="message-input"
                        type="text"
                        maxlength="500"
                        autocomplete="off"
                        placeholder="Write a message..."
                        required
                    >

                    <button
                        id="send-button"
                        type="submit"
                    >
                        Send
                    </button>
                </form>

                <p
                    id="chat-error"
                    class="error-message chat-error"
                    role="alert"
                ></p>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>
</body>
</html>
