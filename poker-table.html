<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Education Perfect</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="poker.css">
</head>

<body>
    <main class="page poker-page">
        <div class="poker-layout">

            <nav class="site-nav">
                <a href="index.html" class="nav-link">
                    Chat
                </a>

                <a href="poker.html" class="nav-link active">
                    Poker
                </a>

                <a href="recovery.html" class="nav-link">
                    Recovery
                </a>

                <a href="account.html" class="nav-link">
                    Account
                </a>

                <button
                    id="logout-button"
                    class="nav-button"
                    type="button"
                >
                    Log out
                </button>
            </nav>

            <section class="panel live-poker-panel">

                <header class="live-poker-header">
                    <div>
                        <p class="eyebrow">
                            MULTIPLAYER TEXAS HOLD'EM
                        </p>

                        <h1 id="table-name">
                            Loading match...
                        </h1>

                        <p
                            id="table-description"
                            class="description"
                        ></p>
                    </div>

                    <div class="poker-user-summary">
                        <span id="current-username">
                            Loading...
                        </span>

                        <span class="balance-badge">
                            <span id="wallet-balance">0</span>
                            wallet
                        </span>
                    </div>
                </header>

                <div class="game-information-bar">
                    <span>
                        Players:
                        <strong id="player-count-label">
                            0/0
                        </strong>
                    </span>

                    <span>
                        Street:
                        <strong id="street-label">
                            Waiting
                        </strong>
                    </span>

                    <span>
                        Pot:
                        <strong id="pot-label">
                            0
                        </strong>
                    </span>

                    <span>
                        Current bet:
                        <strong id="current-bet-label">
                            0
                        </strong>
                    </span>
                </div>
                <section
                    id="join-queue-panel"
                    class="join-queue-panel hidden"
                >
                    <div>
                        <p class="eyebrow">
                            NEXT-HAND QUEUE
                        </p>

                        <strong>
                            Players joining after this hand
                        </strong>
                    </div>

                    <div
                        id="join-queue-list"
                        class="join-queue-list"
                    ></div>
                </section>

                <div class="holdem-table">

                    <section
                        id="opponent-seats"
                        class="opponent-seats"
                        aria-label="Other poker players"
                    ></section>

                    <section class="community-board">
                        <div
                            id="community-cards"
                            class="playing-card-row"
                        ></div>

                        <p
                            id="winner-message"
                            class="winner-message"
                        ></p>
                    </section>

                    <section
                        id="own-seat"
                        class="live-player-seat own-live-seat"
                    ></section>

                </div>

                <section class="own-hand-panel">
                    <div class="own-hand-cards">
                        <div class="own-hand-heading">
                            <p class="eyebrow">
                                YOUR HAND
                            </p>

                            <button
                                id="hide-cards-button"
                                class="secondary-button"
                                type="button"
                            >
                                Hide cards
                            </button>
                        </div>

                        <div
                            id="own-hole-cards"
                            class="playing-card-row"
                        ></div>
                    </div>

                    <div class="own-stack-summary">
                        <span>Table stack</span>

                        <strong id="own-stack-label">
                            0
                        </strong>
                    </div>
                </section>

                <section
                    id="waiting-controls"
                    class="poker-control-panel"
                >
                    <p id="waiting-text">
                        Waiting for players.
                    </p>

                    <button
                        id="start-hand-button"
                        type="button"
                        class="hidden"
                    >
                        Start hand
                    </button>
                </section>

                <section
                    id="action-controls"
                    class="poker-control-panel hidden"
                >
                    <div class="primary-actions">
                        <button
                            id="fold-button"
                            type="button"
                            class="danger-button"
                        >
                            Fold
                        </button>

                        <button
                            id="check-call-button"
                            type="button"
                        >
                            Check
                        </button>

                        <button
                            id="all-in-button"
                            type="button"
                        >
                            All in
                        </button>
                    </div>

                    <div class="raise-controls">
                        <label for="raise-amount-input">
                            Total bet
                        </label>

                        <input
                            id="raise-amount-input"
                            type="number"
                            min="1"
                            step="1"
                        >

                        <button
                            id="bet-raise-button"
                            type="button"
                        >
                            Bet
                        </button>
                    </div>
                </section>

                <p
                    id="turn-message"
                    class="turn-message"
                ></p>

                <div class="poker-bottom-layout">

                    <section class="action-history-panel">
                        <p class="eyebrow">
                            HAND HISTORY
                        </p>

                        <ol
                            id="action-history"
                            class="action-history"
                        ></ol>
                    </section>

                    <section class="match-management-panel">
                        <button
                            id="repair-table-button"
                            class="secondary-button"
                            type="button"
                        >
                            Repair table
                        </button>

                        <a
                            href="poker.html"
                            class="button-link secondary-link"
                        >
                            Lobby
                        </a>

                        <button
                            id="leave-match-button"
                            type="button"
                            class="danger-button"
                        >
                            Leave match
                        </button>
                    </section>

                </div>

                <p
                    id="table-error"
                    class="form-message"
                    role="alert"
                ></p>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="poker-table.js"></script>
</body>
</html>
